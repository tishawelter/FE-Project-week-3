<!--Table has four columns, gave alternating rows a strip to allow for easier reading, set column width, 
remaining table styling is set in the style.css file-->
<table class="table table-striped table-hover" style="width: 80%;">
  <thead>
    <tr>
      <th scope="col">Common Name</th>
      <th scope="col">Color</th>
      <th scope="col">Bloom Season</th>
      <th scope="col">Habitat</th>
    </tr>
  </thead>
  
  <!--this is the information show in the table-->
  <tbody>  
      <tr>
        <td>Tulip</td>
        <td>Red</td>
        <td>Spring</td>
        <td>Sun and Shade</td>
      </tr>

      <tr>
        <td>Rose</td>
        <td>Yellow</td>
        <td>Summer</td>
        <td>Full Sun</td>
      </tr>

      <tr>
        <td>Iris</td>
        <td>Purple</td>
        <td>Spring</td>
        <td>Sun and Shade</td>
      </tr>

      <tr>
        <td>Weeping Cherry Tree</td>
        <td>Fushia Pink</td>
        <td>Spring</td>
        <td>Sun</td>
      </tr>
    </tbody>
</table>
